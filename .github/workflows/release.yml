name: Release

# Packaging adapted from yetone/magpie-releases release.yml, commit d576def.
# Keep upstream asset names and native smoke checks, but build this repository
# at one immutable commit and publish only to zwenooo/magpie. No deploy key,
# upstream dispatch, model API or external announcement credentials are used.
# macOS release signing is optional: MAC_CERTIFICATE_P12 + its password, and
# either the App Store Connect API key or Apple ID secrets used upstream.
# Build-only runs always use ad-hoc signing and receive no signing credentials.

on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source ref in this fork (blank: selected workflow commit)'
        type: string
        default: ''
      version:
        description: 'va.OFFICIAL-vb.FORK tag (blank: tag version or fork-commit)'
        type: string
        default: ''
      publish:
        description: 'Publish the matching va.OFFICIAL-vb.FORK tag on main'
        type: boolean
        default: false

permissions:
  contents: read

# A build already running must finish, especially once it starts publishing.
concurrency:
  group: release-${{ github.ref }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.repository == 'zwenooo/magpie'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}
      prerelease: ${{ steps.source.outputs.prerelease }}
      upstream_version: ${{ steps.source.outputs.upstream_version }}
      fork_version: ${{ steps.source.outputs.fork_version }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate release source
        id: source
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: bash build/fork/release-metadata.sh

  quality:
    needs: prepare
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: read

  fork-checks:
    needs: prepare
    uses: ./.github/workflows/fork.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: read

  # Compile the vendored headless Cursor protocol bridge on its native target.
  # It is embedded in Magpie, never fetched from an upstream release at runtime.
  cursor-backend:
    needs: prepare
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target_os: darwin
            arch: arm64
          - os: macos-15-intel
            target_os: darwin
            arch: amd64
          - os: windows-latest
            target_os: windows
            arch: amd64
          - os: windows-11-arm
            target_os: windows
            arch: arm64
          - os: ubuntu-22.04
            target_os: linux
            arch: amd64
          - os: ubuntu-22.04-arm
            target_os: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Cache pinned Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/cursor-backend/target
          key: cursor-backend-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('native/cursor-backend/Cargo.lock', 'native/cursor-backend/rust-toolchain.toml', 'native/cursor-backend/**/Cargo.toml') }}
      - name: Build bundled Cursor backend
        shell: pwsh
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: ./build/fork/build-cursor-backend.ps1 -TargetOS '${{ matrix.target_os }}' -TargetArch '${{ matrix.arch }}' -Verify
      - name: Verify bundled backend starts without touching Cursor
        env:
          MAGPIE_TEST_BUNDLED: '1'
        run: go test -tags nogui ./internal/cursorbyok -run '^TestCursorBYOKBundled' -count=1 -timeout 5m
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cursor-backend-${{ matrix.target_os }}-${{ matrix.arch }}
          path: |
            internal/cursorbyok/payload/magpie-cursor-backend*
            internal/cursorbyok/payload/backend.json
            internal/cursorbyok/payload/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  mac:
    needs: [prepare, cursor-backend]
    timeout-minutes: 65
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout magpie source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cursor-backend-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/cursor-backend
      - name: Stage verified Cursor backend
        run: node build/fork/stage-cursor-backend.mjs "$RUNNER_TEMP/cursor-backend" darwin '${{ matrix.arch }}' '${{ needs.prepare.outputs.sha }}'

      - name: Probe macOS signing secrets
        id: signing
        env:
          P12: ${{ needs.prepare.outputs.publish == 'true' && secrets.MAC_CERTIFICATE_P12 || '' }}
        run: |
          if [ -n "$P12" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::Build-only run or no MAC_CERTIFICATE_P12: ad-hoc signing without notarization."
          fi

      - name: Import macOS certificates
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERTIFICATE_P12: ${{ needs.prepare.outputs.publish == 'true' && secrets.MAC_CERTIFICATE_P12 || '' }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f $RUNNER_TEMP/certificate.p12

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in MAC_CERTIFICATE_P12"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> $GITHUB_ENV

      - name: Sign Cursor backend and build magpie.app
        run: |
          helper=internal/cursorbyok/payload/magpie-cursor-backend
          if [ -n "$IDENTITY" ]; then
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$helper"
          else
            codesign --force --sign - "$helper"
          fi
          codesign --verify --strict "$helper"
          make app VERSION="$VERSION"
          cp THIRD-PARTY-NOTICES.txt magpie.app/Contents/Resources/
          # Include the helper as inspectable signed code for Apple's notary.
          mkdir -p magpie.app/Contents/Helpers
          cp "$helper" magpie.app/Contents/Helpers/

      - name: Set native bundle version fields
        if: needs.prepare.outputs.upstream_version != ''
        env:
          OFFICIAL_VERSION: ${{ needs.prepare.outputs.upstream_version }}
          FORK_VERSION: ${{ needs.prepare.outputs.fork_version }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $OFFICIAL_VERSION" magpie.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $FORK_VERSION" magpie.app/Contents/Info.plist

      - name: Sign magpie.app
        run: |
          if [ -n "$IDENTITY" ]; then
            codesign --force --options runtime --timestamp --sign "$IDENTITY" magpie.app
          else
            codesign --force --sign - magpie.app
          fi
          codesign --verify --strict --verbose=2 magpie.app
          codesign -dv --verbose=2 magpie.app 2>&1 | grep -E 'Authority|TeamIdentifier|flags|Identifier'

      - name: Build dmg
        run: |
          DMG=magpie-darwin-${{ matrix.arch }}.dmg
          mkdir -p $RUNNER_TEMP/dmg
          cp -R magpie.app $RUNNER_TEMP/dmg/
          ln -s /Applications $RUNNER_TEMP/dmg/Applications
          # The Intel runners' hdiutil fails now and then with "create
          # failed - Resource busy" while something still holds the image
          # it makes; the release was lost each time (yetone/magpie#1846).
          for try in 1 2 3 4 5; do
            hdiutil create -volname magpie -srcfolder $RUNNER_TEMP/dmg -ov -format UDZO "$DMG" && break
            [ "$try" = 5 ] && exit 1
            echo "hdiutil create failed (try $try), trying again"
            rm -f "$DMG"
            sleep $((try * 10))
          done
          if [ -n "$IDENTITY" ]; then
            codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          fi
          echo "DMG=$DMG" >> $GITHUB_ENV

      - name: Notarise and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            echo "$APPLE_API_KEY_P8" > $RUNNER_TEMP/AuthKey.p8
            AUTH=(--key $RUNNER_TEMP/AuthKey.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          else
            AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          # The dmg's ticket covers the app inside it too, so one submission
          # does for both: staple the dmg, and the app for the zip.
          OUT=$(xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait --timeout 30m --output-format json)
          echo "$OUT"
          ID=$(echo "$OUT" | jq -r .id)
          STATUS=$(echo "$OUT" | jq -r .status)
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$ID" "${AUTH[@]}" || true
            rm -f $RUNNER_TEMP/AuthKey.p8
            echo "::error::Notarisation $STATUS"
            exit 1
          fi
          rm -f $RUNNER_TEMP/AuthKey.p8
          # stapler fetches the ticket from Apple's CloudKit, which drops the
          # connection now and then (error 68): try again before failing
          staple() {
            for i in 1 2 3 4 5; do
              xcrun stapler staple "$1" && return 0
              echo "staple $1 failed (try $i), retrying in $((i * 20))s"
              sleep $((i * 20))
            done
            return 1
          }
          staple "$DMG"
          staple magpie.app
          spctl --assess --type execute --verbose=2 magpie.app
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Zip magpie.app
        run: ditto -c -k --keepParent magpie.app magpie-darwin-${{ matrix.arch }}.zip

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
          if [ -f "$RUNNER_TEMP/app-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-darwin-${{ matrix.arch }}
          path: |
            magpie-darwin-*.dmg
            magpie-darwin-*.zip
          if-no-files-found: error

  # The terminal-only magpie (no GUI, no cgo) and the Windows app (WebView2,
  # no cgo either) cross-compile from one runner.
  cli:
    needs: [prepare, cursor-backend]
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout magpie source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cursor-backend-*
          path: ${{ runner.temp }}/cursor-backends
      - name: Build with the verified backend for each target
        run: bash build/fork/release-bundled.sh "$RUNNER_TEMP/cursor-backends" '${{ needs.prepare.outputs.sha }}' "$VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-cli
          path: |
            dist/magpie-cli-*
            dist/magpie-windows-*.exe
          if-no-files-found: error

  # Launch the Windows app for real: it has to come up and serve the gateway.
  windows-check:
    needs: [prepare, cli]
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MAGPIE_UPDATE_FEED: http://127.0.0.1:9/
      MAGPIE_NOTES_FEED: http://127.0.0.1:9/
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: amd64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Download build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: build-cli
          path: dist

      - name: Launch magpie
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\magpie-windows-${{ matrix.arch }}.exe").Path
          New-Item -ItemType File -Path 'dist\.portable' -Force | Out-Null
          $v = (& $exe --version | Out-String).Trim()
          Write-Output $v
          if ($v -notlike "magpie $env:VERSION*") { throw "unexpected version: $v" }
          $log = "$env:RUNNER_TEMP\magpie"
          $p = Start-Process -FilePath $exe -ArgumentList app -WindowStyle Hidden -PassThru -RedirectStandardOutput "$log.out" -RedirectStandardError "$log.err"
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              if ($p.HasExited) { throw "magpie exited with $($p.ExitCode)" }
              try { Invoke-WebRequest http://127.0.0.1:3425/v1/models -UseBasicParsing -TimeoutSec 2 | Out-Null; $ok = $true; break } catch {}
            }
            if (-not $ok) { throw 'the gateway never answered' }
            Start-Sleep -Seconds 5
            if ($p.HasExited) { throw "magpie exited with $($p.ExitCode)" }
            Write-Output 'magpie ran and served the gateway'
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -ErrorAction SilentlyContinue }
            Get-Content "$log.out", "$log.err" -ErrorAction SilentlyContinue
          }

  # The Linux app links GTK 3 and WebKitGTK 4.1, so each arch builds on its
  # own runner. Ubuntu 22.04 keeps the glibc requirement low.
  linux:
    needs: [prepare, cursor-backend]
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout magpie source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install GTK and WebKitGTK
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus-x11

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cursor-backend-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/cursor-backend
      - name: Stage verified Cursor backend
        run: node build/fork/stage-cursor-backend.mjs "$RUNNER_TEMP/cursor-backend" linux '${{ matrix.arch }}' '${{ needs.prepare.outputs.sha }}'

      - name: Build
        run: make release-linux VERSION="$VERSION"

      - name: Launch magpie
        env:
          MAGPIE_UPDATE_FEED: http://127.0.0.1:9/
          MAGPIE_NOTES_FEED: http://127.0.0.1:9/
        run: |
          BIN="$PWD/dist/magpie-linux-${{ matrix.arch }}"
          "$BIN" --version | grep -F "magpie $VERSION"
          touch dist/.portable
          # Limit the whole session, including Xvfb/dbus, even if startup fails.
          timeout 120s xvfb-run -a dbus-launch --exit-with-session "$BIN" app > "$RUNNER_TEMP/magpie.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; pkill -f "^$BIN app" || true; cat "$RUNNER_TEMP/magpie.log"' EXIT
          for i in $(seq 30); do
            sleep 2
            kill -0 "$app_pid" || { echo '::error::magpie exited during startup'; exit 1; }
            curl -fs --max-time 2 -o /dev/null http://127.0.0.1:3425/v1/models && break
          done
          sleep 5
          kill -0 "$app_pid"
          curl -fs --max-time 2 -o /dev/null http://127.0.0.1:3425/v1/models || { echo '::error::magpie did not come up'; exit 1; }
          echo 'magpie ran and served the gateway'

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-linux-${{ matrix.arch }}
          path: dist/magpie-linux-${{ matrix.arch }}
          if-no-files-found: error

  package:
    needs: [prepare, mac, cli, windows-check, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: Verify complete asset set and checksums
        run: |
          cp THIRD-PARTY-NOTICES.txt dist/
          bash build/fork/release-assets.sh dist
      - name: Generate bilingual release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: bash build/fork/release-notes.sh "${TAG:-$VERSION}" "$SOURCE_SHA" "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  publish:
    needs: [prepare, quality, fork-checks, package]
    if: needs.prepare.outputs.publish == 'true' && github.repository == 'zwenooo/magpie'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-bundle
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-notes
          path: notes
      - name: Recheck release tag and artifact integrity
        run: |
          [[ "$GITHUB_REPOSITORY" == zwenooo/magpie ]]
          source build/fork/release-version.sh
          parse_fork_release "$TAG"
          [[ "$VERSION" == "$release_version" ]]
          git fetch --no-tags origin "refs/tags/$TAG"
          [[ $(git rev-parse 'FETCH_HEAD^{commit}') == "$SOURCE_SHA" ]] || { echo 'Release tag moved during the build.' >&2; exit 1; }
          git fetch --no-tags origin refs/heads/main
          git merge-base --is-ancestor "$SOURCE_SHA" FETCH_HEAD
          (cd dist && sha256sum --check SHA256SUMS)
          bash build/fork/release-assets.sh dist
      - name: Publish complete release
        run: |
          # A draft prevents a partially uploaded release being advertised.
          # Re-running can finish a draft, but cannot replace published binaries.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/existing-release.json" >/dev/null || { echo 'A published release already exists; refusing to overwrite it.' >&2; exit 1; }
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes/release-notes.md
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "magpie fork $TAG" --notes-file notes/release-notes.md
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort > "$RUNNER_TEMP/published-assets.txt"
          find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/published-assets.txt"
          # Publishing an older stable version must not demote a newer Latest.
          source build/fork/release-version.sh
          latest_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')
          make_latest=false
          if [[ "$PRERELEASE" == false ]]; then
            make_latest=$(fork_release_latest "$VERSION" "$latest_tag")
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$PRERELEASE" --latest="$make_latest"

  homebrew:
    needs: [prepare, publish]
    if: needs.publish.result == 'success' && needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release
      - name: Update this fork's Homebrew formula and cask
        env:
          TAP_SUMS_FILE: ${{ runner.temp }}/release/SHA256SUMS
        run: |
          set -euo pipefail
          # Releasing an older stable tag must not downgrade the tap.
          previous=$(sed -n 's/^  version "\([^"]*\)"/\1/p' Casks/magpie-app.rb 2>/dev/null || true)
          if [ -n "$previous" ] && [ "$(printf '%s\n%s\n' "$VERSION" "$previous" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "Tap is already newer ($previous); leaving it unchanged."
            exit 0
          fi
          bash scripts/update-tap.sh "$TAG"
          git add Formula/magpie.rb Casks/magpie-app.rb
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "brew: update fork downloads to $VERSION"
          git push origin HEAD:main
