name: UI preview

# A pull request that changes the UI gets screenshots — and a screen
# recording, the mouse drawn in, when the change spans pages or needs
# clicking to see — of the real app built from it, in a fixed block at the
# foot of its description. See .github/ui-preview/.
#
# The scripts come from the default branch. Only a branch in this same
# repository may be built with the DeepSeek key; external PRs are skipped,
# including manually selected ones. Fork maintainers opt in with the
# ENABLE_AI_UI_PREVIEW repository variable and their own ui-preview secret.
# The recording job has no write permission; the publishing job never runs
# the PR's code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

concurrency:
  group: ui-preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect:
    if: (github.repository == 'yetone/magpie' || (github.repository == 'zwenooo/magpie' && vars.ENABLE_AI_UI_PREVIEW == 'true')) && (github.event.action != 'labeled' || github.event.label.name == 'ui-preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      ui: ${{ steps.detect.outputs.ui }}
      sha: ${{ steps.detect.outputs.sha }}
      number: ${{ steps.detect.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/ui-preview
          persist-credentials: false
      - id: detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/ui-preview/publish.mjs detect
      # what the recorder reads of the PR, handed over so its job needs no token
      - if: steps.detect.outputs.ui == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.detect.outputs.number }}
        run: |
          mkdir pr-info
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" -H "Accept: application/vnd.github.diff" > pr-info/pr.diff
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .title > pr-info/title.txt
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.body // ""' > pr-info/body.txt
      - if: steps.detect.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-info
          path: pr-info
          retention-days: 3

  record:
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ui-preview
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ci
          sparse-checkout: .github/ui-preview
          persist-credentials: false
      # detect accepts only open PRs whose head and base belong to this
      # repository, then pins the checked commit for this read-only job.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pr-info
          path: pr-info
      - uses: actions/setup-go@v5
        with:
          go-version-file: pr/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chromium, ffmpeg and fonts
        working-directory: ci/.github/ui-preview
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-color-emoji
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Record
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DIFF_FILE: ${{ github.workspace }}/pr-info/pr.diff
          PR_BODY_FILE: ${{ github.workspace }}/pr-info/body.txt
        run: PR_TITLE="$(cat pr-info/title.txt)" ci/.github/ui-preview/run.sh pr out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: out
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [detect, record]
    if: always() && needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/ui-preview
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ui-preview
          path: out
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ needs.detect.outputs.number }}
          SHA: ${{ needs.detect.outputs.sha }}
          OUT_DIR: out
          RECORD_RESULT: ${{ needs.record.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/ui-preview/publish.mjs publish
