name: Fork integration checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable source commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  fork:
    if: github.repository == 'zwenooo/magpie'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify fork integration
        run: go test -tags nogui ./internal/cursorbyok ./internal/agent ./internal/update -run 'TestCursorBYOK|TestPortMovesEveryAgent|TestDisconnectStaysThroughSync|TestGrokInstalled|TestFork' -count=1 -timeout 10m
      - name: Verify application updates and Cursor restart
        run: go test -tags nogui ./internal/gui -run 'TestForkUpdate|TestCursorBackend' -count=1 -timeout 5m
      - name: Vet
        run: go vet -tags nogui ./...
      - name: Race check
        if: runner.os != 'Windows'
        run: go test -race -tags nogui ./internal/cursorbyok ./internal/agent ./internal/update ./internal/gui -run 'TestCursorBYOK|TestCursorBackend|TestFork' -count=1 -timeout 5m
